<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fishing Game</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="rotate-banner">
        <svg class="rotate-icon-svg" viewBox="0 0 24 24">
            <path
                d="M16 1H8C6.34 1 5 2.34 5 4v16c0 1.66 1.34 3 3 3h8c1.66 0 3-1.34 3-3V4c0-1.66-1.34-3-3-3zm-2 20h-4v-1h4v1zm3.25-3H6.75V4h10.5v14z" />
        </svg>
    </div>

    <div id="game-container">
        <img id="background" src="">
        <img id="foreground" src="">

        <div id="ui-layer">
            <button id="cast-btn">CAST</button>
            <button id="set-btn" class="set-btn hidden">SET</button>
        </div>

        <button id="back-btn" class="back-btn">BACK</button>
        <button id="source-btn" class="source-btn">SOURCE</button>

        <button id="mend-btn" class="mend-btn hidden">MEND</button>
        <button id="reset-btn" class="reset-btn hidden">RESET</button>

        <div id="minigame-overlay" class="hidden">
            <div id="tension-bar">
                <div id="green-zone"></div>
                <div id="indicator"></div>
            </div>
            <button id="strip-btn" class="strip-btn">STRIP</button>
        </div>

        <div id="fish-display" class="hidden">
            <div id="fish-record-text"
                style="color: gold; font-size: 32px; font-weight: bold; text-shadow: 2px 2px 4px #000; margin-bottom: 10px;">
            </div>
            <div id="fish-size-text"></div>
            <img id="fish-image" src="" alt="Fish">
            <div id="fish-text"></div>
            <button id="caught-cast-btn">RELEASE</button>
        </div>
    </div>

    <script src="game.js"></script>
</body>

</html>
