<!doctype html>
<html lang="es">

<head>
    <title>Paco Juego</title>
    <meta name="description" content="¡Salta la cuerda!">
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../style.css" />
    <script type="text/javascript" src="../app.js"></script>
</head>

<body onload="loadCode()">
    <div class="navbar">
        <a href="../index.html">Nuevo Juego</a>
        <a href="../special-code/index.html">Código Especial</a>
        <a href="javascript:copyCode()" id="specialCode"></a>
    </div>

    <div id="gameContainer">
        <canvas id="gameCanvas"
            style="display: block; background: #87CEEB; width: 100%; max-width: 600px; margin: 0 auto;"></canvas>
    </div>

    <script>
        const BASE_WIDTH = 600;
        const GROUND_Y = 420;
        const PLAYER_GROUND_Y = 400;
        const ROPE_RADIUS = 150;
        const ROPE_SWING_RANGE = Math.PI * 30;
        const GRAVITY = 0.8;
        const JUMP_POWER = -15;
        const ROPE_SPEED_INCREASE = 0.3;
        const WIN_SCORE = 10;

        let canvas;
        let ctx;
        let scale;
        let playerY;
        let playerJumping = false;
        let jumpVelocity = 0;
        let ropeAngle = 0;
        let ropeDirection = 1;
        let ropeSpeed = 2;
        let score = 0;
        let lastScore = 0;
        let lastRopeDirection = 1;
        let scoreElement;

        function s(value) {
            return value * scale;
        }

        canvas = document.getElementById('gameCanvas');
        ctx = canvas.getContext('2d');
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        function resizeCanvas() {
            const container = canvas.parentElement;
            const maxWidth = Math.min(container.clientWidth, BASE_WIDTH);
            canvas.width = maxWidth;
            canvas.height = maxWidth;
            scale = canvas.width / BASE_WIDTH;
            playerY = PLAYER_GROUND_Y;
        }

        function playerJump() {
            if (!playerJumping) {
                playerJumping = true;
                jumpVelocity = JUMP_POWER * scale;
            }
        }

        function updatePlayer() {
            if (playerJumping) {
                jumpVelocity += GRAVITY * scale;
                playerY += jumpVelocity;

                if (playerY >= PLAYER_GROUND_Y) {
                    playerY = PLAYER_GROUND_Y;
                    playerJumping = false;
                    jumpVelocity = 0;
                }
            }
        }

        function updateRope() {
            ropeAngle += ropeDirection * ropeSpeed * scale;

            absRopeAngle = Math.abs(ropeAngle);
            bottom = ROPE_SWING_RANGE * scale;
            if (absRopeAngle >= bottom - 20) {
                if (absRopeAngle >= bottom) {
                    ropeDirection *= -1;
                }

                if (ropeAngle > bottom - 20) {
                    if (lastScore === score) {
                        if (playerJumping) {
                            score++;
                            ropeSpeed += ROPE_SPEED_INCREASE;
                            if (score >= WIN_SCORE) {
                                window.location.href = '95KK7.html';
                            }
                        } else {
                            score = 0;
                            ropeSpeed = 2;
                        }
                    }
                } else {
                    lastScore = score;
                }
            }

            lastRopeDirection = ropeDirection;
        }

        function drawRope() {
            const centerX = canvas.width / 2;
            const groundY = s(PLAYER_GROUND_Y);
            const ropeRad = s(ROPE_RADIUS);

            // Curve
            ctx.strokeStyle = '#654321';
            ctx.lineWidth = s(3);
            ctx.beginPath();
            ctx.moveTo(centerX - ropeRad, groundY);
            ctx.quadraticCurveTo(centerX, ropeAngle + groundY, centerX + ropeRad, groundY);
            ctx.stroke();

            // Endpoints
            ctx.fillStyle = '#8B4513';
            ctx.beginPath();
            ctx.arc(centerX - ropeRad, groundY, s(5), 0, 2 * Math.PI);
            ctx.arc(centerX + ropeRad, groundY, s(5), 0, 2 * Math.PI);
            ctx.fill();
        }

        function drawCloud(x, y, size) {
            ctx.fillStyle = '#FFFFFF';
            ctx.beginPath();
            ctx.arc(s(x), s(y), s(20) * size, 0, Math.PI * 2);
            ctx.arc(s(x + 25 * size), s(y - 10 * size), s(25) * size, 0, Math.PI * 2);
            ctx.arc(s(x + 55 * size), s(y), s(20) * size, 0, Math.PI * 2);
            ctx.arc(s(x + 25 * size), s(y + 10 * size), s(22) * size, 0, Math.PI * 2);
            ctx.fill();
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Ground
            ctx.fillStyle = '#90EE90';
            ctx.fillRect(0, s(GROUND_Y), canvas.width, canvas.height - s(GROUND_Y));

            // Rope behind player if swinging backward
            if (ropeDirection < 0) {
                drawRope();
            }

            // Player
            ctx.font = `${s(70)}px Arial`;
            ctx.fillText("🤠", canvas.width / 2, s(playerY) + s(40));

            // Rope in front of player if swinging forward
            if (ropeDirection > 0) {
                drawRope();
            }

            // Score below player
            if (score < WIN_SCORE) {
                ctx.fillStyle = '#000';
                ctx.font = `${s(24)}px Courier New`;
                ctx.textAlign = 'center';
                ctx.fillText(10 - score, canvas.width / 2, s(GROUND_Y + 75));
            }

            // Clouds
            drawCloud(50, 80, 1);
            drawCloud(400, 50, 0.8);
            drawCloud(250, 120, 1.2);
            drawCloud(150, 40, 0.7);
            drawCloud(500, 100, 1);
        }

        function gameLoop() {
            updatePlayer();
            updateRope();
            draw();
            requestAnimationFrame(gameLoop);
        }

        function handleJump() {
            if (!playerJumping) {
                playerJump();
            }
        }

        document.addEventListener('keydown', (event) => {
            if (event.code === 'Space') {
                event.preventDefault();
                handleJump();
            }
        });

        document.addEventListener('click', handleJump);

        gameLoop();
    </script>
</body>

</html>
